version: '3.8'

services:
  api:
    build: .
    container_name: fastapi-login-system
    ports:
      - "1234:1234"
    environment:
      - SECRET_KEY=your-secret-key-change-this-in-production
      - DATABASE_URL=postgresql://appuser:appsecret@db:5432/appdb
    depends_on:
      - db
    restart: unless-stopped
    volumes:
      - ./:/app
    command: uvicorn main:app --host 0.0.0.0 --port 1234 --reload

  db:
    image: postgres:15
    container_name: fastapi-db
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: appsecret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
