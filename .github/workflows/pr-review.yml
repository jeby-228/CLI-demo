name: PR Review CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - master
      - develop

permissions:
  contents: read
  pull-requests: write

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 black bandit pytest pytest-cov httpx
        
    - name: Code formatting check with Black
      run: |
        black --check --diff .
      continue-on-error: true
      
    - name: Linting with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true
      
    - name: Security check with Bandit
      run: |
        bandit -r . -f json -o bandit-report.json || true
        bandit -r . -f screen
      continue-on-error: true
      
    - name: Upload Bandit report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: bandit-security-report
        path: bandit-report.json

  dependency-check:
    name: Dependency Vulnerability Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install pip-audit
      run: |
        python -m pip install --upgrade pip
        pip install pip-audit
        
    - name: Run pip-audit
      run: |
        pip-audit -r requirements.txt --desc || true
      continue-on-error: true

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov httpx
        
    - name: Create basic test file if not exists
      run: |
        if [ ! -f test_main.py ]; then
          cat > test_main.py << 'EOF'
        from fastapi.testclient import TestClient
        from main import app
        
        client = TestClient(app)
        
        def test_read_root():
            response = client.get("/")
            assert response.status_code == 200
            assert "message" in response.json()
        
        def test_login_success():
            response = client.post("/login", json={
                "username": "user@example.com",
                "password": "password123"
            })
            assert response.status_code == 200
            assert "access_token" in response.json()
        
        def test_login_failure():
            response = client.post("/login", json={
                "username": "user@example.com",
                "password": "wrongpassword"
            })
            assert response.status_code == 401
        EOF
        fi
        
    - name: Run tests with pytest
      run: |
        pytest -v --cov=. --cov-report=xml --cov-report=term
      continue-on-error: true
      
    - name: Upload coverage report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: coverage-report
        path: coverage.xml

  hurl-test:
    name: Hurl API Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Install Hurl
      run: |
        curl --location --remote-name https://github.com/Orange-OpenSource/hurl/releases/download/4.3.0/hurl_4.3.0_amd64.deb
        sudo dpkg -i hurl_4.3.0_amd64.deb
        hurl --version
        
    - name: Start FastAPI server in background
      run: |
        python main.py &
        echo $! > server.pid
        sleep 5
        
    - name: Run Hurl tests
      run: |
        if [ -f api-tests.hurl ]; then
          hurl --test --color api-tests.hurl
        else
          echo "No Hurl test files found, skipping..."
        fi
      continue-on-error: true
      
    - name: Stop FastAPI server
      if: always()
      run: |
        if [ -f server.pid ]; then
          kill $(cat server.pid) || true
        fi

  pr-comment:
    name: PR Summary Comment
    runs-on: ubuntu-latest
    needs: [code-quality, dependency-check, test, hurl-test]
    if: always()
    permissions:
      contents: read
      pull-requests: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Create PR comment
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const prNumber = context.issue.number;
          const jobs = [
            { name: 'Code Quality Checks', result: '${{ needs.code-quality.result }}' },
            { name: 'Dependency Vulnerability Check', result: '${{ needs.dependency-check.result }}' },
            { name: 'Run Tests', result: '${{ needs.test.result }}' },
            { name: 'Hurl API Tests', result: '${{ needs.hurl-test.result }}' }
          ];
          
          let commentBody = '## 🤖 PR Review CI 結果\n\n';
          commentBody += '| 檢查項目 | 結果 |\n';
          commentBody += '|---------|------|\n';
          
          jobs.forEach(job => {
            const emoji = job.result === 'success' ? '✅' : 
                         job.result === 'failure' ? '❌' : '⚠️';
            commentBody += `| ${job.name} | ${emoji} ${job.result} |\n`;
          });
          
          commentBody += '\n### 檢查項目說明：\n';
          commentBody += '- **Code Quality Checks**: 程式碼品質檢查（格式化、語法檢查、安全性掃描）\n';
          commentBody += '- **Dependency Vulnerability Check**: 相依套件漏洞檢查\n';
          commentBody += '- **Run Tests**: 自動化測試執行\n';
          commentBody += '- **Hurl API Tests**: Hurl HTTP API 測試\n';
          commentBody += '\n詳細資訊請查看 [Actions 執行紀錄](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\n';
          
          github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: prNumber,
            body: commentBody
          });
